---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: driftproposals.backflow.io
spec:
  group: backflow.io
  names:
    kind: DriftProposal
    listKind: DriftProposalList
    plural: driftproposals
    shortNames:
    - dp
    singular: driftproposal
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.application.name
      name: Application
      type: string
    - jsonPath: .spec.resource.kind
      name: Kind
      type: string
    - jsonPath: .spec.resource.name
      name: Resource
      type: string
    - jsonPath: .spec.actor.username
      name: Actor
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.mapping.strategy
      name: Strategy
      priority: 1
      type: string
    - jsonPath: .status.mergeRequest.url
      name: MR
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          DriftProposal is a captured difference between Git and the cluster,
          and its journey back to Git.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DriftProposalSpec is written by the operator when drift is detected.
              It is immutable after creation; a newer drift on the same resource
              creates a new proposal and supersedes this one.
            properties:
              actor:
                description: Who made the change in the cluster, when known.
                properties:
                  groups:
                    items:
                      type: string
                    type: array
                  userAgent:
                    description: How the change was made, e.g. kubectl, console, or
                      a controller name.
                    type: string
                  username:
                    type: string
                required:
                - username
                type: object
              application:
                description: Argo CD Application that owns the resource.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                - namespace
                type: object
              changes:
                description: Field-level changes between Git (desired) and the cluster
                  (live).
                items:
                  description: FieldChange is a single field difference.
                  properties:
                    desired:
                      description: JSON-encoded value in Git. Empty for Add.
                      type: string
                    live:
                      description: JSON-encoded value in the cluster. Empty for Remove.
                      type: string
                    op:
                      description: ChangeOperation is the kind of change on a field.
                      enum:
                      - Add
                      - Replace
                      - Remove
                      type: string
                    path:
                      description: JSON pointer in the resource, e.g. /spec/replicas.
                      type: string
                  required:
                  - op
                  - path
                  type: object
                minItems: 1
                type: array
              detectedAt:
                description: When the drift was first observed.
                format: date-time
                type: string
              policyName:
                description: Policy that captured this drift.
                type: string
              resource:
                description: The drifted resource.
                properties:
                  group:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                  version:
                    type: string
                required:
                - kind
                - name
                - version
                type: object
              source:
                description: Where the resource comes from in Git.
                properties:
                  path:
                    description: Path inside the repository; for Helm repos, the chart
                      name.
                    type: string
                  repoURL:
                    type: string
                  revision:
                    description: Revision Argo CD last synced (commit SHA).
                    type: string
                  targetRevision:
                    description: Branch or tag the Application tracks.
                    type: string
                  type:
                    description: SourceType is how the drifted resource is produced
                      from Git.
                    enum:
                    - Directory
                    - Kustomize
                    - Helm
                    type: string
                required:
                - repoURL
                - revision
                - type
                type: object
            required:
            - application
            - changes
            - detectedAt
            - policyName
            - resource
            - source
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: DriftProposalStatus tracks the proposal through mapping and
              review.
            properties:
              commitSHA:
                description: Commit that contains the change, once merged or committed
                  directly.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              mapping:
                description: Mapping records where each change lands in the source.
                properties:
                  diff:
                    description: Unified diff of the edited files, truncated to 32
                      KiB.
                    maxLength: 32768
                    type: string
                  edits:
                    items:
                      description: SourceEdit is one edit in a Git file.
                      properties:
                        changeIndex:
                          description: Index into spec.changes this edit satisfies.
                          format: int32
                          type: integer
                        file:
                          description: File path relative to the repository root.
                          type: string
                        location:
                          description: For Helm values, the dotted values path; otherwise
                            a JSON pointer in the file.
                          type: string
                        value:
                          description: JSON-encoded new value.
                          type: string
                      required:
                      - changeIndex
                      - file
                      - location
                      - value
                      type: object
                    type: array
                  reason:
                    description: Why the change could not be mapped. Set only when
                      strategy is Unmapped.
                    type: string
                  strategy:
                    description: MappingStrategy is how the change was traced back
                      to source.
                    enum:
                    - Direct
                    - KustomizePatch
                    - HelmValues
                    - ApplicationOverride
                    - Unmapped
                    type: string
                  verified:
                    description: True when a re-render with the edits reproduced the
                      live state exactly.
                    type: boolean
                required:
                - strategy
                type: object
              mergeRequest:
                description: MergeRequestRef points to the merge request opened for
                  this proposal.
                properties:
                  branch:
                    type: string
                  number:
                    description: Provider-side number (GitLab iid, GitHub PR number).
                    format: int64
                    type: integer
                  state:
                    description: Provider-reported state, e.g. opened, merged, closed.
                    type: string
                  url:
                    type: string
                required:
                - branch
                - number
                - state
                - url
                type: object
              message:
                description: Human-readable explanation of the current phase.
                type: string
              phase:
                description: ProposalPhase is the lifecycle stage of a proposal.
                enum:
                - Detected
                - Mapping
                - Unmapped
                - Proposed
                - Merged
                - Rejected
                - Reverted
                - Superseded
                - Failed
                type: string
              supersededBy:
                description: Proposal that replaced this one.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
