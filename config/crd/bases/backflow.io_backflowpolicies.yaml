                      not Ready (ServerNotAllowed) and no request is made.
                    properties:
                      caSecretRef:
                        description: Secret key, in this namespace, holding a PEM
                          CA bundle used to verify the Argo CD server.
                        properties:
                          key:
                            description: Key of the Secret that holds the value.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret.
