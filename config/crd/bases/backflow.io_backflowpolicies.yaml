              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              BackflowPolicySpec selects Argo CD Applications whose drift is captured
              and decides how that drift flows back to Git.
            properties:
              applications:
                description: Applications this policy applies to.
                properties:
                  names:
                    items:
                      maxLength: 253
                      minLength: 1
                      type: string
                    maxItems: 100
                    type: array
                    x-kubernetes-list-type: set
                  selector:
                    description: |-
                      A label selector is a label query over a set of resources. The result of matchLabels and
                      matchExpressions are ANDed. An empty label selector matches all objects. A null
                      label selector matches no objects.
                    properties:
                      matchExpressions:
                        description: matchExpressions is a list of label selector
                          requirements. The requirements are ANDed.
                        items:
                          description: |-
                            A label selector requirement is a selector that contains values, a key, and an operator that
                            relates the key and values.
                          properties:
                            key:
                              description: key is the label key that the selector
                                applies to.
                              type: string
                            operator:
                              description: |-
                                operator represents a key's relationship to a set of values.
                                Valid operators are In, NotIn, Exists and DoesNotExist.
                              type: string
                            values:
                              description: |-
                                values is an array of string values. If the operator is In or NotIn,
                                the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                the values array must be empty. This array is replaced during a strategic
                                merge patch.
                              items:
                                type: string
                              type: array
                              x-kubernetes-list-type: atomic
                          required:
                          - key
                          - operator
                          type: object
                        type: array
                        x-kubernetes-list-type: atomic
                      matchLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                          map is equivalent to an element of matchExpressions, whose key field is "key", the
                          operator is "In", and the values array contains only "value". The requirements are ANDed.
                        type: object
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
                x-kubernetes-validations:
                - message: set names, selector, or both
                  rule: (has(self.names) && size(self.names) > 0) || has(self.selector)
              argoCD:
                default: {}
                description: Where the Argo CD Applications are and how to reach the
                  Argo CD API.
                properties:
                  namespace:
                    default: argocd
                    description: |-
                      Namespace where Argo CD Applications live.
                      "argocd" for upstream Argo CD, "openshift-gitops" for OpenShift GitOps.
                    maxLength: 63
                    type: string
                  server:
                    description: |-
                      Argo CD API connection used to read managed resources for drift detection.
                      When unset, the connection the installer gave the operator (its flags
                      --argocd-server, --argocd-token-secret-* and --argocd-ca-file; the chart
                      values argocd.*) is used, and status.argoCD says so. Drift detection is
                      skipped while neither exists. A policy can only name Secrets of its own
                      namespace; it cannot point the operator at a Secret elsewhere. A server of its own must
