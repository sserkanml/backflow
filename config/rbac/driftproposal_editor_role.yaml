# This rule is not used by the project backflow itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the backflow.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: backflow
    app.kubernetes.io/managed-by: kustomize
  name: driftproposal-editor-role
rules:
- apiGroups:
  - backflow.io
  resources:
  - driftproposals
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - backflow.io
  resources:
  - driftproposals/status
  verbs:
  - get
