# Watches Argo CD Applications labelled env=test and proposes live changes
# back to Git as merge requests. Needs an ScmConnection for the repository host
# and a Secret with an Argo CD API token (read access to applications):
#   kubectl -n backflow-system create secret generic argocd-token --from-literal=token="$ARGOCD_TOKEN"
# The Argo CD server must be the operator's own (chart value argocd.server) or in argocd.allowedServers.
apiVersion: backflow.io/v1
kind: BackflowPolicy
metadata:
  labels:
    app.kubernetes.io/name: backflow
    app.kubernetes.io/managed-by: kustomize
  name: test-apps
  namespace: backflow-system
spec:
  applications:
    selector:
      matchLabels:
        env: test
  # MergeRequest, DirectCommit or ReportOnly. Start with ReportOnly to see what would be proposed.
  mode: MergeRequest
  argoCD:
    namespace: argocd
    server:
      url: https://argocd-server.argocd.svc
      tokenSecretRef:
        name: argocd-token
        key: token
      # For an Argo CD with a private CA, point to a Secret holding the PEM bundle:
      # caSecretRef:
      #   name: argocd-ca
      #   key: ca.crt
  exclude:
  - kind: Secret
  ignoreFields:
  - kind: Deployment
    group: apps
    jsonPointers:
    - /spec/replicas   # owned by an autoscaler
  git:
    branchPrefix: backflow/
    mergeRequest:
      labels:
      - backflow
      assignActor: true
  batchWindow: 30s
  # Finished proposals (merged, rejected, reverted, superseded, failed) are deleted after this long;
  # open and Unmapped ones never. 0s keeps them for ever.
  retention:
    finishedProposals: 336h
