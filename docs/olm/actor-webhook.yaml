# Generated by hack/olm-actor-webhook.sh from the Helm chart (make olm-actor-webhook). Do not edit.
#
# The optional actor webhook for an installation from OperatorHub on OpenShift: it records who changed a resource, so that a
# proposal can name the user. See docs/install/openshift.md ("The actor webhook"). Replace OPERATOR_NAMESPACE and WEBHOOK_PATH:
#
#   sed -e 's/OPERATOR_NAMESPACE/openshift-operators/g' -e "s#WEBHOOK_PATH#observe-$(openssl rand -hex 16)#g" actor-webhook.yaml
---
# Observe only: it never denies. failurePolicy Ignore, sideEffects None, a timeout of a second, and an
# answer that is always "allowed". It sees updates of resources Argo CD tracks, not Secrets, not dry
# runs, not status writes, and not the changes of system components and GitOps controllers.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: backflow-controller-manager-actor-webhook
  labels:
    app.kubernetes.io/name: backflow
    control-plane: controller-manager
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
  - name: actor.backflow.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 1
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values:
            - "OPERATOR_NAMESPACE"
            - "kube-system"
            - "kube-public"
            - "kube-node-lease"
    rules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["*", "*/scale"]
        scope: Namespaced
    matchConditions:
      - name: not-secrets
        expression: "request.resource.resource != 'secrets'"
      - name: not-dry-run
        expression: "!has(request.dryRun) || request.dryRun == false"
      - name: tracked-or-scale
        expression: "(has(request.subResource) && request.subResource == 'scale') || (!has(request.subResource) && ((has(object.metadata.annotations) && 'argocd.argoproj.io/tracking-id' in object.metadata.annotations) || (has(object.metadata.labels) && 'app.kubernetes.io/instance' in object.metadata.labels)))"
      - name: not-system-or-gitops-users
        expression: "!request.userInfo.username.startsWith('system:serviceaccount:kube-system:') \u0026\u0026 !request.userInfo.username.startsWith('system:node:') \u0026\u0026 !(request.userInfo.username in ['system:kube-controller-manager', 'system:kube-scheduler']) \u0026\u0026 !(request.userInfo.username in ['system:serviceaccount:OPERATOR_NAMESPACE:backflow-controller-manager', 'system:serviceaccount:argocd:argocd-application-controller'])"
    clientConfig:
      service:
        name: backflow-controller-manager-actor-webhook
        namespace: OPERATOR_NAMESPACE
        path: "/WEBHOOK_PATH"
        port: 443
---
apiVersion: v1
kind: Service
metadata:
  name: backflow-controller-manager-actor-webhook
  namespace: OPERATOR_NAMESPACE
  labels:
    app.kubernetes.io/name: backflow
    control-plane: controller-manager
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: backflow-controller-manager-actor-webhook-tls
spec:
  # Any ready pod serves the webhook, not only the leader.
  selector:
    app.kubernetes.io/name: backflow
    control-plane: controller-manager
  ports:
    - name: https
      port: 443
      targetPort: 9443
      protocol: TCP
