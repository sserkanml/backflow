# Production environment. Not used by any Application of this repository; a
# commit to this file must not pause detection for the development environment.
replicaCount: 3

image:
  tag: 1.27-alpine

global:
  region: us-east-1

config:
  logLevel: warn
  feature: "on"
  colorA: red
  colorB: red
  minA: 10
  minB: 20

demo-sidecar:
  timeoutSeconds: 120
