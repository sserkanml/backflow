---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: driftproposals.backflow.io
spec:
  group: backflow.io
  names:
    categories:
    - backflow
    kind: DriftProposal
    listKind: DriftProposalList
    plural: driftproposals
    shortNames:
    - dp
    - drift
    singular: driftproposal
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.applicationRef.name
      name: Application
      type: string
    - jsonPath: .spec.resourceRef.kind
      name: Kind
      type: string
    - jsonPath: .spec.resourceRef.name
      name: Resource
      type: string
    - jsonPath: .spec.actor.username
      name: Actor
      type: string
    - jsonPath: .spec.managers[0].manager
      name: Changed by
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.mapping.strategy
      name: Strategy
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Mapped")].reason
      name: Mapped
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=="Proposed")].reason
      name: Proposed
      priority: 1
      type: string
    - jsonPath: .status.git.mergeRequest.url
      name: MR
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: |-
          DriftProposal is a captured difference between Git and the cluster,
          and its journey back to Git. Its spec is an immutable observation, not a desired state.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              DriftProposalSpec is written by the operator when drift is detected.
              It is immutable after creation; a newer drift on the same resource
              creates a new proposal and supersedes this one.
            properties:
              actor:
                description: 'Who made the change in the cluster, when known: from
                  the actor webhook.'
                properties:
                  groups:
                    description: The groups of that user, under the same conditions.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: atomic
                  kind:
                    description: |-
                      Person or controller (a service account), from a verified record of the actor webhook.
                      It is set even when names are not recorded.
                    enum:
                    - Person
                    - Controller
                    type: string
                  username:
                    description: |-
                      The Kubernetes username, from a verified record of the actor webhook. Empty: the
                      webhook is off, saw no matching change, or was told not to record names.
                    maxLength: 253
                    type: string
                type: object
              applicationRef:
                description: Argo CD Application that owns the resource.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - name
                - namespace
                type: object
              changes:
                description: Field-level changes between Git (desired) and the cluster
                  (live), at most 256.
                items:
                  description: FieldChange is a single field difference.
                  properties:
                    desired:
                      description: JSON-encoded value in Git. Empty for Add.
                      maxLength: 16384
                      type: string
                    live:
                      description: JSON-encoded value in the cluster. Empty for Remove.
                      maxLength: 16384
                      type: string
                    op:
                      description: ChangeOperation is the kind of change on a field.
                      enum:
                      - Add
                      - Replace
                      - Remove
                      type: string
                    path:
                      description: JSON pointer in the resource, e.g. /spec/replicas.
                      maxLength: 1024
                      pattern: ^/
                      type: string
                  required:
                  - op
                  - path
                  type: object
                  x-kubernetes-validations:
                  - message: an Add has no desired value
                    rule: self.op != 'Add' || !has(self.desired)
                  - message: a Remove has no live value
                    rule: self.op != 'Remove' || !has(self.live)
                maxItems: 256
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              detectedAt:
                description: When the drift was first observed.
                format: date-time
                type: string
              managers:
                description: |-
                  The managedFields writers of the drifted fields, most recent first. The first is the
                  latest writer. Argo CD's own managers are never listed.
                items:
                  description: |-
                    ManagerWrite is a field manager that wrote drifted fields, from the managedFields of the live
                    object: a tool (kubectl-patch, kubectl-edit, oc, Mozilla for a browser console) or a controller
                    (kube-controller-manager for an HPA).
                  properties:
                    fields:
                      description: The drifted paths (JSON pointers) it wrote.
                      items:
                        maxLength: 1024
                        type: string
                      maxItems: 16
                      type: array
                      x-kubernetes-list-type: atomic
                    manager:
                      maxLength: 253
                      minLength: 1
                      type: string
                    operation:
                      description: The operation of that managedFields entry.
                      enum:
                      - Update
                      - Apply
                      type: string
                    time:
                      description: When that entry was written. Some entries (a subresource
                        such as scale) have no time.
                      format: date-time
                      type: string
                  required:
                  - manager
                  type: object
                maxItems: 5
                type: array
                x-kubernetes-list-type: atomic
              policyRef:
                description: Policy, in this namespace, that captured this drift.
                properties:
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              resourceRef:
                description: The drifted resource.
                properties:
                  group:
                    maxLength: 253
                    type: string
                  kind:
                    maxLength: 63
                    minLength: 1
                    type: string
                  name:
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    maxLength: 63
                    type: string
                  version:
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                - version
                type: object
              sources:
                description: |-
                  Every source of the Application, in order, each at the revision Argo CD compared against
                  when the drift was observed. The edits of the proposal are written to the one with role
                  Values, or, when there is none, to the one with role Render.
                items:
                  description: ProposalSource is one source of the Application of
                    a proposal.
                  properties:
                    chart:
                      description: Chart name, for a chart from a Helm repository
                        or a registry.
                      maxLength: 253
                      type: string
                    path:
                      description: Path inside a Git repository.
                      maxLength: 1024
                      type: string
                    position:
                      description: Position in spec.sources of the Application, from
                        1.
                      format: int32
                      minimum: 1
                      type: integer
                    ref:
                      description: Name of a ref source, referenced as $name/... in
                        value files.
                      maxLength: 253
                      type: string
                    repoURL:
                      maxLength: 2048
                      type: string
                    revision:
                      description: |-
                        Revision Argo CD resolved and compared against: a commit SHA, or the chart
                        version of a chart from a Helm repository or a registry.
                      maxLength: 255
                      type: string
                    role:
                      description: SourceRole is what a source of an Application is
                        for.
                      enum:
                      - Render
                      - Values
                      - Reference
                      type: string
                    targetRevision:
                      description: Branch, tag, chart version or range the source
                        tracks.
                      maxLength: 255
                      type: string
                    type:
                      description: How Argo CD renders the source. Empty for a ref
                        source.
                      enum:
                      - Directory
                      - Kustomize
                      - Helm
                      - Plugin
                      type: string
                  required:
                  - position
                  - repoURL
                  - revision
                  - role
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              truncated:
                description: |-
                  True when the drift had more than 256 changes and only the first 256 are listed. Such a
                  proposal is created Unmapped (reason TooManyChanges): nothing is proposed to Git for it.
                type: boolean
            required:
            - applicationRef
            - changes
            - detectedAt
            - policyRef
            - resourceRef
            - sources
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
          status:
            description: DriftProposalStatus tracks the proposal through mapping and
              review.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              finishedAt:
                description: |-
                  When the proposal reached a final phase (Merged, Rejected, Reverted, Superseded, Failed).
                  spec.retention.finishedProposals of the policy counts from here.
                format: date-time
                type: string
              git:
                description: GitStatus is what the proposal did in Git.
                properties:
                  branch:
                    description: |-
                      Branch Backflow pushes (or is about to push) for the merge request. It is
                      recorded before the push, so a branch or merge request left behind by a
                      crash can still be found and cleaned up.
                    maxLength: 255
                    type: string
                  commitSHA:
                    description: Commit that contains the change, once merged or committed
                      directly.
                    maxLength: 64
                    type: string
                  mergeRequest:
                    description: MergeRequestRef points to the merge request opened
                      for this proposal.
                    properties:
                      number:
                        description: Provider-side number (GitLab iid, GitHub PR number).
                        format: int64
                        type: integer
                      state:
                        description: |-
                          Provider-reported state, e.g. opened, merged, closed. The set is the provider's: consumers
                          must tolerate values they do not know.
                        maxLength: 64
                        type: string
                      url:
                        maxLength: 2048
                        type: string
                    required:
                    - number
                    - state
                    - url
                    type: object
                  push:
                    description: Bookkeeping of declined pushes.
                    properties:
                      lastRejectedAt:
                        description: When the push was last declined; the next attempt
                          waits from here.
                        format: date-time
                        type: string
                      rejections:
                        description: How many times the Git server declined the push
                          of this proposal.
                        format: int32
                        type: integer
                    type: object
                type: object
              mapping:
                description: |-
                  Mapping records where each change lands in the source. Why a proposal is not mapped is the
                  reason of its Mapped condition.
                properties:
                  applicationOption:
                    description: |-
                      Where the value is set in the Application, when an option of the
                      Application (helm.parameters, kustomize.images, ...) decides a drifted
                      field. Set only when the Mapped condition has reason SetByApplication.
                      Nothing is proposed: no Argo CD API renders an Application with a changed
                      spec, so the edit cannot be verified by a render of the child.
                    properties:
                      applicationRef:
                        description: The Application whose option sets the value.
                        properties:
                          name:
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            maxLength: 63
                            minLength: 1
                            type: string
                        required:
                        - name
                        - namespace
                        type: object
                      current:
                        description: JSON-encoded value the option has now.
                        maxLength: 16384
                        type: string
                      option:
                        description: The option, such as spec.source.helm.parameters[name=image.tag].
                        maxLength: 1024
                        type: string
                      optionPath:
                        description: |-
                          JSON pointer of the option's value in the Application resource, such as
                          /spec/source/helm/parameters/0/value.
                        maxLength: 1024
                        type: string
                      parent:
                        description: The parent Application and its Git file.
                        properties:
                          diff:
                            description: |-
                              Unified diff of the edit that sets the suggested value, verified by a
                              render of the parent. Empty when there is no suggested value.
                            maxLength: 32768
                            type: string
                          file:
                            description: |-
                              File that defines the option and where in it (a key path for Helm, a JSON
                              pointer otherwise).
                            maxLength: 1024
                            type: string
                          location:
                            maxLength: 1024
                            type: string
                          message:
                            description: Why the state is what it is, for people.
                            maxLength: 1024
                            type: string
                          name:
                            description: |-
                              The parent Application as namespace/name, or the ApplicationSet that
                              generated the child.
                            maxLength: 512
                            type: string
                          repoURL:
                            description: Git repository and commit the parent was
                              rendered at.
                            maxLength: 2048
                            type: string
                          revision:
                            maxLength: 255
                            type: string
                          state:
                            description: |-
                              ApplicationParentState says what is known about the Git file that defines the
                              Application whose option sets the value.
                            enum:
                            - Located
                            - NotManagedFromGit
                            - GeneratedByApplicationSet
                            - NotVerifiable
                            - OutOfSync
                            - Ambiguous
                            - NotVisible
                            type: string
                        required:
                        - state
                        type: object
                      suggested:
                        description: |-
                          JSON-encoded value that would reproduce the live state, when it can be
                          derived exactly (a parameter, a valuesObject key, an image tag, a replica
                          count, a label). Empty when it cannot, or when the option is a string that
                          holds YAML (helm.values, kustomize patches).
                        maxLength: 16384
                        type: string
                    required:
                    - applicationRef
                    - option
                    type: object
                  collateral:
                    description: |-
                      Changes the edits also make beyond the drifted fields, which the policy
                      allowed (spec.helm.allowCollateralChanges). Set only for HelmValues.
                    items:
                      description: CollateralChange is a field the edit changes although
                        it did not drift.
                      properties:
                        current:
                          description: JSON-encoded value before the edit (the value
                            of the unmodified render).
                          maxLength: 16384
                          type: string
                        group:
                          maxLength: 253
                          type: string
                        kind:
                          maxLength: 63
                          type: string
                        name:
                          maxLength: 253
                          type: string
                        namespace:
                          maxLength: 63
                          type: string
                        new:
                          description: JSON-encoded value after the edit.
                          maxLength: 16384
                          type: string
                        path:
                          description: JSON pointer in the rendered resource.
                          maxLength: 1024
                          type: string
                      required:
                      - current
                      - kind
                      - name
                      - new
                      - path
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                  diff:
                    description: Unified diff of the edited files, truncated to 32
                      KiB.
                    maxLength: 32768
                    type: string
                  edits:
                    items:
                      description: SourceEdit is one edit in a Git file.
                      properties:
                        changeIndex:
                          description: Index into spec.changes this edit satisfies.
                          format: int32
                          minimum: 0
                          type: integer
                        file:
                          description: File path relative to the repository root.
                          maxLength: 1024
                          type: string
                        location:
                          description: For Helm values, the dotted values path; otherwise
                            a JSON pointer in the file.
                          maxLength: 1024
                          type: string
                        repoURL:
                          description: |-
                            Repository the edit is written to: the repository of the source with role Values, or of the
                            only source.
                          maxLength: 2048
                          type: string
                        value:
                          description: JSON-encoded new value.
                          maxLength: 16384
                          type: string
                      required:
                      - changeIndex
                      - file
                      - location
                      - value
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                  strategy:
                    description: How the change was traced back to source. Empty for
                      a proposal that is not mapped.
                    enum:
                    - Direct
                    - KustomizePatch
                    - HelmValues
                    - ApplicationOverride
                    type: string
                  unmapped:
                    description: |-
                      Fields of spec.changes the edits leave out, with the reason for each. Set
                      only for a partial mapping (spec.mapping.allowPartial of the policy): the
                      edits then cover the other changes, and these fields stay different from
                      Git after the merge request is merged.
                    items:
                      description: UnmappedField is a drifted field that a partial
                        mapping leaves out.
                      properties:
                        message:
                          description: Why the field could not be traced back to Git,
                            for people.
                          maxLength: 1024
                          type: string
                        path:
                          description: JSON pointer of the field in the resource.
                          maxLength: 1024
                          type: string
                        reason:
                          description: |-
                            Machine-readable reason, such as UnsupportedChange or NoVerifiedCandidate. The set of
                            reasons grows; consumers must tolerate values they do not know.
                          maxLength: 64
                          pattern: ^[A-Z][A-Za-z0-9]*$
                          type: string
                      required:
                      - message
                      - path
                      - reason
                      type: object
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: atomic
                  verified:
                    description: True when a re-render with the edits reproduced the
                      live state exactly.
                    type: boolean
                type: object
              message:
                description: 'Human-readable explanation of the current phase: the
                  message of the condition that caused it.'
                maxLength: 2048
                type: string
              phase:
                description: |-
                  ProposalPhase is the lifecycle stage of a proposal. It summarises the conditions; consumers
                  must tolerate values that are added later.
                enum:
                - Detected
                - Mapping
                - Unmapped
                - Proposed
                - Merged
                - Rejected
                - Reverted
                - Superseded
                - Failed
                type: string
              signals:
                description: Facts left by the policy and drift controllers; see Signals.
                properties:
                  accessRevoked:
                    description: True when the policy may no longer see the Application,
                      so the proposal is retired.
                    type: boolean
                  liveRevertedAtRevision:
                    description: |-
                      The revision of an Argo CD sync that reset the live resource to Git while the proposal was
                      open. Cleared when the live change returns.
                    maxLength: 255
                    type: string
                  rejectionReported:
                    description: |-
                      True once the rejection of a Rejected proposal was reported (an event), so it is not
                      reported again.
                    type: boolean
                  reverted:
                    description: |-
                      Why the proposal has no reason to exist any more (for example: its drift is gone before
                      it was proposed). The proposal becomes Reverted with this message.
                    maxLength: 1024
                    type: string
                  supersededBy:
                    description: The name of the newer proposal that replaced this
                      one.
                    maxLength: 253
                    type: string
                type: object
              supersededBy:
                description: Proposal that replaced this one.
                maxLength: 253
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
