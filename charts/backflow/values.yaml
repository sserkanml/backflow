# Default values of the backflow chart.

image:
  repository: ghcr.io/sserkanml/backflow
  # Defaults to the appVersion of the chart.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# More than one replica needs leaderElection.
replicaCount: 1
leaderElection: true

# How often the state of an open merge request is polled.
mergeRequestPollInterval: 2m

# How often a working ScmConnection is verified again. Secrets are not watched,
# so this is also how long a rotated token or CA bundle can go unnoticed; a
# change of the ScmConnection itself is verified at once.
scmRecheckInterval: 5m

# How long a Secret that was read stays in memory (0 reads it every time).
secretCacheTTL: 30s

# Where the operator may read Secrets (ScmConnection tokens and CA bundles, the
# Argo CD token). Empty: a ClusterRole rule lets it get any Secret by name, in
# every namespace. A list of namespaces replaces that rule with a Role and a
# RoleBinding granting "get" on Secrets in each of them and in the release
# namespace; an ScmConnection or BackflowPolicy whose Secret is anywhere else is
# not Ready (SecretForbidden). The operator never lists or watches Secrets.
secretNamespaces: []

# The Argo CD connection of every BackflowPolicy that has no spec.argoCD. It is set
# here, by whoever installs the operator, and never by a policy: a policy can name
# Secrets of its own namespace only, so it cannot make the operator read a Secret
# elsewhere. A policy with its own spec.argoCD keeps using that.
argocd:
  # The Argo CD API server, e.g. https://openshift-gitops-server.openshift-gitops.svc
  server: ""
  # The Secret that holds the API token of an Argo CD account. OpenShift GitOps
  # writes it for a local user (spec.localUsers of the ArgoCD resource) as
  # <user>-local-user, key apiToken, and renews it before it expires.
  # With secretNamespaces set, the chart grants "get" on Secrets in this namespace too.
  tokenSecret:
    namespace: ""
    name: ""
    key: apiToken
  # A PEM CA bundle file that verifies the server, if you mount one yourself
  # (extraVolumes, extraVolumeMounts). Read again when it changes. serviceCA does it for you.
  caFile: ""
  # OpenShift: a ConfigMap whose CA bundle OpenShift fills in with the service CA
  # (annotation service.beta.openshift.io/inject-cabundle), mounted into the pod and
  # used to verify the server. For a server with a serving certificate signed by
  # the service CA, like openshift-gitops-server.
  serviceCA: false
  # Which Applications the policies of which namespaces may match through this
  # connection, which can read every Application. A policy without spec.argoCD sees
  # only the Applications whose spec.project is allowed for its namespace; the others
  # are only counted in its status. "*" matches any namespace or project.
  #
  #   defaultAccess:
  #     - policyNamespaces: [team-a]
  #       projects: [team-a]
  #     - policyNamespaces: [platform]
  #       projects: ["*"]
  #
  # Empty (the default): only the policies in the namespace the operator is installed
  # in may use it, for every project. A policy in any other namespace is not Ready
  # (ArgoCDDefaultNotAllowed). A single-tenant cluster that wants every policy to
  # see everything sets [{policyNamespaces: ["*"], projects: ["*"]}].
  # A policy with its own spec.argoCD is not affected: Argo CD decides what its token sees.
  defaultAccess: []

# OpenShift: a ConfigMap labelled config.openshift.io/inject-trusted-cabundle that
# OpenShift fills in with the cluster's trusted CA bundle (the proxy's trustedCA),
# mounted into the pod. Its roots are added for the connection to GitLab and GitHub of
# every ScmConnection that has no caSecretRef. The company CA must be in the cluster's
# trusted CA bundle (the Proxy resource's spec.trustedCA) for this to help.
trustedCABundle: false

# Upload the file:// dependencies of a Helm chart unpacked under charts/, so that Argo CD
# does not run helm dependency build on every render of a proposal. It is used for a
# chart only after one render both ways gave identical resources; false switches it off.
unpackFileDependencies: true

# Extra volumes and mounts of the manager pod, e.g. a CA bundle for argocd.caFile.
extraVolumes: []
extraVolumeMounts: []

# The time all renders through Argo CD of one verification may take together.
# A proposal that needs more is Unmapped (RenderBudgetExceeded). Raise it when
# Argo CD takes seconds per render, which an Application with several sources
# and many candidates multiplies.
renderBudget: 2m

# Extra command line arguments of the operator, e.g. ["--zap-log-level=debug"].
extraArgs: []

# Starting points, not guarantees: memory grows with the number of
# Argo CD Applications held in the informer cache and with the size of the Git
# repositories being mapped. Tune per cluster.
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

# The root file system is read-only, so Git repositories are cached on an
# emptyDir mounted at /var/cache/backflow. The cache is disposable: it is
# fetched again when empty.
repoCache:
  sizeLimit: 2Gi

# The defaults meet the "restricted" Pod Security Standard and OpenShift's
# restricted-v2 SCC. No user or group ID is set: OpenShift assigns them, and
# any ID works with the image. Add runAsUser, runAsGroup or fsGroup here if
# your cluster needs fixed ones.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

serviceAccount:
  create: true
  # Defaults to the full name of the release plus -controller-manager.
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

metrics:
  # Serve metrics over HTTPS on port 8443, protected by Kubernetes
  # authentication and authorization (a client needs the metrics-reader role).
  enabled: false
  # A Secret with tls.crt and tls.key to serve with. Without one the operator
  # generates a self-signed certificate.
  certSecret: ""

serviceMonitor:
  # Needs metrics.enabled and the Prometheus Operator CRDs.
  enabled: false
  interval: ""
  labels: {}
  # Scraping verifies nothing by default because of the self-signed certificate.
  tlsConfig:
    insecureSkipVerify: true

prometheusRule:
  # Alerts on the metrics of the operator, for the Prometheus Operator (needs its
  # CRDs, and Prometheus must scrape the operator: see serviceMonitor). The
  # alerts are explained in the README, "Metrics and alerts".
  enabled: false
  # Labels the Prometheus of your installation selects rules by, for example
  # release: kube-prometheus-stack.
  labels: {}
  # Added to the labels of every alert, next to severity.
  alertLabels: {}
  interval: ""

grafanaDashboard:
  # A ConfigMap with the Backflow dashboard, which the Grafana sidecar loads
  # from the ConfigMaps that carry the label below.
  enabled: false
  # The label the sidecar looks for (grafana_dashboard is the default of the
  # Grafana and kube-prometheus-stack charts).
  labels:
    grafana_dashboard: "1"
  annotations: {}
  # Where to put the ConfigMap; defaults to the release namespace. Some sidecars
  # watch one namespace only.
  namespace: ""

networkPolicy:
  # Needs metrics.enabled. Allows ingress to the metrics port from the
  # namespaces that match metricsNamespaceSelector; nothing else is allowed in.
  enabled: false
  metricsNamespaceSelector:
    matchLabels:
      metrics: enabled
