---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: changerecords.internal.backflow.io
spec:
  group: internal.backflow.io
  names:
    kind: ChangeRecord
    listKind: ChangeRecordList
    plural: changerecords
    shortNames:
    - chr
    singular: changerecord
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.resource
      name: Resource
      type: string
    - jsonPath: .spec.name
      name: Name
      type: string
    - jsonPath: .spec.actorKind
      name: Kind
      type: string
    - jsonPath: .spec.fieldManager
      name: Manager
      type: string
    - jsonPath: .spec.lastSeen
      name: Last seen
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ChangeRecord is written by the actor webhook of the operator, in the operator's
          namespace, and deleted after actorWebhook.retention. It holds user names: it is for
          the operator and its administrators, not for tenants. It is not part of the public API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ChangeRecordSpec is who changed which fields of a resource and when, as the
              admission webhook of the operator saw it. It holds the paths of the changed
              fields and never a value.
            properties:
              actorKind:
                description: 'Person or controller (a service account): the only identity
                  stored when names are not.'
                enum:
                - Person
                - Controller
                type: string
              count:
                description: How many changes were merged.
                format: int32
                type: integer
              fieldManager:
                description: The field manager of the request.
                maxLength: 253
                type: string
              firstSeen:
                description: When the first change merged into this record was made,
                  and the last.
                format: date-time
                type: string
              group:
                maxLength: 253
                type: string
              groups:
                description: The groups of the user. Empty when the operator is told
                  not to record names.
                items:
                  maxLength: 253
                  type: string
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              lastSeen:
                format: date-time
                type: string
              name:
                maxLength: 253
                minLength: 1
                type: string
              namespace:
                maxLength: 63
                type: string
              paths:
                description: The JSON pointers of the changed fields. Never values.
                items:
                  maxLength: 1024
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: atomic
              resource:
                description: The plural resource name, as in the admission request.
                maxLength: 253
                minLength: 1
                type: string
              resourceVersion:
                description: The resourceVersion of the object after the last change
                  merged into this record.
                maxLength: 64
                type: string
              subresource:
                description: The subresource of the request (for example scale). Empty
                  for the resource itself.
                maxLength: 63
                type: string
              uid:
                description: UID of the changed object.
                maxLength: 64
                minLength: 1
                type: string
              username:
                description: The Kubernetes user name. Empty when the operator is
                  told not to record names.
                maxLength: 253
                type: string
            required:
            - actorKind
            - count
            - firstSeen
            - lastSeen
            - name
            - paths
            - resource
            - uid
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
