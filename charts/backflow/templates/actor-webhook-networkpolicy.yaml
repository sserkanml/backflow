{{- if and .Values.actorWebhook.enabled .Values.actorWebhook.networkPolicy.enabled }}
# The webhook port is reachable from the API server only. The webhook cannot tell who calls it, so
# the network has to.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "backflow.actorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "backflow.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- if include "backflow.actorIsOpenShift" . }}
        # The API server runs on the host network.
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/host-network: ""
        {{- else }}
        {{- range .Values.actorWebhook.networkPolicy.apiserverCIDRs }}
        - ipBlock:
            cidr: {{ . | quote }}
        {{- end }}
        {{- end }}
      ports:
        - port: 9443
          protocol: TCP
{{- end }}
