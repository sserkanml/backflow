{{- include "backflow.validate" . }}
{{- if and (gt (int .Values.replicaCount) 1) (not .Values.leaderElection) }}
{{- fail "replicaCount > 1 needs leaderElection: true" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backflow.managerName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "backflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "backflow.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "backflow.serviceAccountName" . }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10
      containers:
        - name: manager
          image: {{ include "backflow.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /manager
          args:
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
            - --health-probe-bind-address=:8081
            - --repo-cache-dir=/var/cache/backflow
            - --merge-request-poll-interval={{ .Values.mergeRequestPollInterval }}
            - --render-budget={{ .Values.renderBudget }}
            - --scm-recheck-interval={{ .Values.scmRecheckInterval }}
            - --secret-cache-ttl={{ .Values.secretCacheTTL }}
            {{- if .Values.argocd.server }}
            - --argocd-server={{ .Values.argocd.server }}
            - --argocd-token-secret-namespace={{ .Values.argocd.tokenSecret.namespace }}
            - --argocd-token-secret-name={{ .Values.argocd.tokenSecret.name }}
            - --argocd-token-secret-key={{ .Values.argocd.tokenSecret.key | default "apiToken" }}
            {{- if .Values.argocd.serviceCA }}
            - --argocd-ca-file={{ include "backflow.serviceCAFile" . }}
            {{- else if .Values.argocd.caFile }}
            - --argocd-ca-file={{ .Values.argocd.caFile }}
            {{- end }}
            {{- end }}
            {{- if not .Values.unpackFileDependencies }}
            - --unpack-file-dependencies=false
            {{- end }}
            {{- if .Values.trustedCABundle }}
            - --trusted-ca-file={{ include "backflow.trustedCAFile" . }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:8443
            {{- if .Values.metrics.certSecret }}
            - --metrics-cert-path=/var/run/metrics-cert
            {{- end }}
            {{- end }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            {{- if .Values.metrics.enabled }}
            - name: https
              containerPort: 8443
              protocol: TCP
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: repo-cache
              mountPath: /var/cache/backflow
            {{- if and .Values.metrics.enabled .Values.metrics.certSecret }}
            - name: metrics-cert
              mountPath: /var/run/metrics-cert
              readOnly: true
            {{- end }}
            {{- if and .Values.argocd.server .Values.argocd.serviceCA }}
            # A directory mount, not a single file: a changed ConfigMap reaches the pod without a restart.
            - name: argocd-service-ca
              mountPath: /var/run/argocd-ca
              readOnly: true
            {{- end }}
            {{- if .Values.trustedCABundle }}
            - name: trusted-ca
              mountPath: /var/run/trusted-ca
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: repo-cache
          emptyDir:
            sizeLimit: {{ .Values.repoCache.sizeLimit }}
        {{- if and .Values.metrics.enabled .Values.metrics.certSecret }}
        - name: metrics-cert
          secret:
            secretName: {{ .Values.metrics.certSecret }}
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
        {{- end }}
        {{- if and .Values.argocd.server .Values.argocd.serviceCA }}
        - name: argocd-service-ca
          configMap:
            name: {{ include "backflow.fullname" . }}-service-ca
        {{- end }}
        {{- if .Values.trustedCABundle }}
        - name: trusted-ca
          configMap:
            name: {{ include "backflow.fullname" . }}-trusted-ca
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
