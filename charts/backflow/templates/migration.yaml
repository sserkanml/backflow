{{- if .Values.migration.enabled }}
{{- if not (or .Values.migration.backup.existingClaim .Values.migration.backup.emptyDir) }}
{{- fail "migration.enabled needs migration.backup.existingClaim (a PersistentVolumeClaim for the backup), or migration.backup.emptyDir: true to say that a backup that does not outlive the Job is enough" }}
{{- end }}
{{- if and .Values.migration.backup.existingClaim .Values.migration.backup.emptyDir }}
{{- fail "set migration.backup.existingClaim or migration.backup.emptyDir, not both" }}
{{- end }}
{{- $name := printf "%s-migrate" (include "backflow.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- $hooks := "pre-upgrade,post-upgrade" }}
{{- /* The hook resources are created before each phase and deleted after it, so that the permissions to rewrite CRDs are not left behind. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backflow.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $hooks }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
# What the tool does to the cluster as a whole: the CRDs it migrates (and the one it adds), the objects it rewrites, and the
# Applications it reads for the chart name of a proposal.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "backflow.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $hooks }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, create, update]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions/status]
    verbs: [get, update, patch]
  - apiGroups: [backflow.io]
    resources: [scmconnections, backflowpolicies, driftproposals, changerecords]
    verbs: [get, list, create, update, patch, delete]
  - apiGroups: [backflow.io]
    resources: [scmconnections/status, backflowpolicies/status, driftproposals/status]
    verbs: [get, update, patch]
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "backflow.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $hooks }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
# Stopping the operator: its Deployment, and the lease that tells it is gone.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backflow.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $hooks }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backflow.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $hooks }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- range $phase := list "pre" "post" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-{{ $phase }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "backflow.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ $phase }}-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ $.Values.migration.timeoutSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "backflow.name" $ }}-migrate
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
        # The backup volume is written by the nonroot user of the image.
        fsGroup: 65532
      containers:
        - name: migrate
          image: {{ include "backflow.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - /manager
          args:
            - migrate
            {{- if eq $phase "pre" }}
            - --backup-dir=/backup
            - --stop-operator
            {{- else }}
            - --restore-operator
            {{- end }}
            - --operator-namespace={{ $.Release.Namespace }}
            - --operator-selector={{ include "backflow.operatorSelector" $ }}
            {{- if eq $phase "pre" }}
            {{- range $.Values.migration.extraArgs }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          {{- with $.Values.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: backup
              mountPath: /backup
      volumes:
        - name: backup
          {{- if $.Values.migration.backup.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ $.Values.migration.backup.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
{{- end }}
