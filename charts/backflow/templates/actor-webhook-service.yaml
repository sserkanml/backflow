{{- if .Values.actorWebhook.enabled }}
{{- include "backflow.actorValidate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backflow.actorName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backflow.labels" . | nindent 4 }}
  {{- if eq (include "backflow.actorTLSMode" .) "serviceCA" }}
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: {{ include "backflow.actorTLSSecret" . }}
  {{- end }}
spec:
  # Any ready pod serves the webhook, not only the leader.
  selector:
    {{- include "backflow.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: actor-webhook
      protocol: TCP
{{- end }}
