# Production values of the postgresql chart.
auth:
  postgresPassword: not-a-real-password
  username: app
  password: not-a-real-password-either
  database: app

primary:
  resourcesPreset: small
  extraEnvVars:
    - name: TZ
      value: UTC
  tolerations:
    - key: dedicated
      operator: Equal
      value: db
      effect: NoSchedule
  persistence:
    size: 20Gi
