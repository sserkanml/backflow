# Production values of the redis chart.
architecture: replication

auth:
  password: not-a-real-password

replica:
  replicaCount: 2
  extraEnvVars:
    - name: TZ
      value: UTC
  tolerations:
    - key: dedicated
      operator: Equal
      value: cache
      effect: NoSchedule

master:
  resourcesPreset: small
  extraEnvVars:
    - name: TZ
      value: UTC
  tolerations:
    - key: dedicated
      operator: Equal
      value: cache
      effect: NoSchedule
  persistence:
    size: 8Gi
