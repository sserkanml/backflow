# Defaults of the chart. An environment overrides what it needs.
replicaCount: 1

image:
  repository: ghcr.io/example/webapp
  tag: "1.4.2"
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 80

config:
  logLevel: info
  region: eu-west-1
  cacheTTL: 300

probes:
  initialDelaySeconds: 5

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []

env:
  - name: LOG_FORMAT
    value: json
