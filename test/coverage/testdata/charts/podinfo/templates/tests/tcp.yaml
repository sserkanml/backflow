apiVersion: v1
kind: Pod
metadata:
  # A random name on every render, as podinfo's tests have.
  name: {{ .Release.Name }}-podinfo-tcp-test-{{ randAlphaNum 5 | lower }}
  annotations:
    helm.sh/hook: test
spec:
  containers:
    - name: tcp
      image: busybox
      command: ["true"]
  restartPolicy: Never
