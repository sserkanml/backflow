apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      tolerations:
      - key: dedicated
        operator: Equal
        value: web
        effect: NoSchedule
      - key: spot
        operator: Exists
      containers:
      - name: web
        image: nginx:1.25
        imagePullPolicy: IfNotPresent
        env:
        - name: LOG_LEVEL
          value: info
        - name: REGION
          value: eu
        ports:
        - containerPort: 8080
        resources:
          limits:
            memory: 256Mi
