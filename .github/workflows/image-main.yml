name: Image (main)

# The image of the main branch, for trying out what is not released yet.
# No chart, no release.
on:
  push:
    branches:
      - main

permissions: {}

env:
  IMAGE: ghcr.io/sserkanml/backflow

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Name the tags
        id: tags
        env:
          SHA: ${{ github.sha }}
        run: |
          {
            echo "commit=${SHA::12}"
            echo "tags<<EOF"
            echo "${IMAGE}:main"
            echo "${IMAGE}:sha-${SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # backflow_build_info reports these; an image of main has no release
          # version, so it says main.
          build-args: |
            VERSION=main
            COMMIT=${{ steps.tags.outputs.commit }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

  olm:
    name: OLM bundle and catalog (main)
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      BUNDLE_REPO: ghcr.io/sserkanml/backflow-bundle
      CATALOG_REPO: ghcr.io/sserkanml/backflow-catalog
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      # The bundle of main names the image of main, and has the version of the next release.
      - name: Generate and validate the bundle
        run: |
          make bundle OPERATOR_IMAGE="${IMAGE}:main"
          make bundle-validate

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the bundle image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: bundle.Dockerfile
          push: true
          tags: ${{ env.BUNDLE_REPO }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Make the catalog
        run: make catalog BUNDLE_IMG="$BUNDLE_REPO:main"

      - name: Push the catalog image (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: catalog
          file: catalog/catalog.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.CATALOG_REPO }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
