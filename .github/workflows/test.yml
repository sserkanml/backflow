name: Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      # test/chart renders the chart; with CI=true a missing helm fails the test.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      # test/chart checks the alert rules with promtool; with CI=true a missing
      # promtool fails the test. The archive is checked against the SHA-256 that
      # Prometheus publishes for the release.
      - name: Set up promtool
        env:
          PROMETHEUS_VERSION: 3.5.0
          PROMETHEUS_SHA256: e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a
        run: |
          archive="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/${archive}"
          echo "${PROMETHEUS_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/promtool"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/promtool" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
          echo "${RUNNER_TEMP}/promtool" >> "$GITHUB_PATH"

      - name: Running Tests
        run: |
          go mod tidy
          make test

  helm:
    permissions:
      contents: read
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.0

      - name: Lint the chart
        run: make helm-lint

      - name: Check that the chart is in sync with make manifests
        run: |
          make helm-sync
          if ! git diff --exit-code -- charts config; then
            echo "The chart (or config/) is out of date. Run 'make helm-sync' and commit the result." >&2
            exit 1
          fi
          if [ -n "$(git ls-files --others --exclude-standard -- charts config)" ]; then
            git ls-files --others --exclude-standard -- charts config >&2
            echo "make helm-sync created files that are not committed." >&2
            exit 1
          fi
