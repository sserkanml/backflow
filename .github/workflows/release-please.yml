name: Release Please

# Opens (and keeps up to date) a release pull request from the Conventional
# Commits on main. Merging it creates the v<version> tag and the GitHub
# release, and the second job then calls release.yml to publish the image and
# the chart. A tag that release-please creates with the default GITHUB_TOKEN does
# not trigger other workflows, which is why release.yml is called from here.
#
# The repository setting "Allow GitHub Actions to create and approve pull
# requests" (Settings > Actions > General) must be on.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
