name: Release

# Runs for the tag release-please creates (v<version>). It publishes the image
# and the Helm chart; it does not create the GitHub release (release-please does).
on:
  push:
    tags:
      - "v*"

permissions: {}

env:
  IMAGE: ghcr.io/sserkanml/backflow
  CHART_REGISTRY: oci://ghcr.io/sserkanml/charts

jobs:
  image:
    name: Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Name the tags
        id: tags
        env:
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          version="${REF_NAME#v}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:sha-${SHA::7}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0

  chart:
    name: Helm chart
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Check that the chart is the one of the tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#v}"
          chart_version="$(sed -n 's/^version: *//p' charts/backflow/Chart.yaml | tr -d '"')"
          app_version="$(sed -n 's/^appVersion: *//p' charts/backflow/Chart.yaml | tr -d '"')"
          if [ "$chart_version" != "$version" ] || [ "$app_version" != "$version" ]; then
            echo "Chart.yaml has version $chart_version and appVersion $app_version; the tag is $REF_NAME" >&2
            exit 1
          fi

      - name: Lint and package
        run: |
          helm lint charts/backflow
          helm package charts/backflow --destination dist

      - name: Log in to ghcr.io
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Push the chart
        run: helm push dist/backflow-*.tgz "$CHART_REGISTRY"
